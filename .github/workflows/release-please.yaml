# Independent versioning per image (see release-please-config.json).
# Opens one release PR per image with releasable changes (feat/fix/perf/deps or
# breaking). Merging that PR makes the `images` workflow publish the new version.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          # PRs created with GITHUB_TOKEN do not trigger workflows, so the required
          # `gate` check would never run on release PRs. RELEASE_PLEASE_TOKEN:
          # fine-grained PAT for this repository with Contents + Pull requests: read/write.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
