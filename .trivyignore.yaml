# Trivy exceptions (https://trivy.dev/latest/docs/configuration/filtering/#trivyignoreyaml)
#
# Use it only for false positives or CVEs with no reasonable way to fix them.
# Every exception needs a justification (`statement`) and an expiry date
# (`expired_at`, at most 90 days out): once it expires, the pipeline blocks again and
# forces a review. Adding or extending an exception requires explicit approval from
# the repository owner.
#
# Whole classes of findings that are never exploitable in a container (e.g. kernel
# headers) go in .trivyignore.rego instead.

