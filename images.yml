# Images published to Docker Hub (docker.io/brsalcedom/<name>): build settings.
#
# Flow:
#   1. A PR that touches images/<name>/: the image is built, tested and scanned with
#      Trivy. If it has fixable HIGH/CRITICAL vulnerabilities, the `gate` check fails.
#   2. Merge to main: release-please opens (or updates) one release PR per image that
#      bumps its version and updates images/<name>/CHANGELOG.md based on the commits
#      (fix -> patch, feat -> minor, `!`/BREAKING CHANGE -> major).
#   3. Merging the release PR: the image is built and scanned again and, if it passes,
#      published as `X.Y.Z`, `X.Y`, `X` and `latest`. A version that already exists on
#      Docker Hub is never overwritten.
#
# The version does NOT live here: it is in .release-please-manifest.json and
# release-please bumps it.
#
# New image: create images/<name>/{Dockerfile,Dockerfile.dockerignore,README.md,CHANGELOG.md},
# add it here, to release-please-config.json (packages) and to
# .release-please-manifest.json with its initial version.
#
# Per-image fields:
#   platforms        (optional)  defaults to linux/amd64,linux/arm64
#   test             (optional)  smoke test; runs with `sh -c` inside the image
#                                (with --entrypoint sh, so it bypasses the ENTRYPOINT)
#   free-disk-space  (optional)  frees ~30GB on the runner before building
#   cache            (optional)  use the GitHub Actions cache across runs (default true;
#                                disable for multi-GB images, the limit is 10GB per
#                                repository)

images:
  homelab-ci:
    test: >-
      tofu version && kubectl version --client && task --version &&
      envsubst --version > /dev/null && git --version && ssh -V &&
      test "$(id -u)" = 1000 && touch /workspace/.write-test

  kubetools:
    test: >-
      kubectl version --client && helm version --short && eksctl version &&
      aws --version && gcloud --version && gke-gcloud-auth-plugin --version

  linode-cli:
    test: linode-cli --version

  node-helloworld:
    test: >-
      (node index.js &) && sleep 2 &&
      wget -qO- http://127.0.0.1:3000/health/readiness

  pentesting:
    platforms: linux/amd64
    free-disk-space: true
    cache: false
    test: >-
      nmap --version && nxc smb --help > /dev/null && kerbrute version &&
      msfconsole --version && impacket-secretsdump -h > /dev/null
